// QikaLib / Fabric 1.21.1 —— 单目标独立工程（per loader × MC 版本一份拷贝，见 TARGETS.md）
plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-${minecraft_version}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven {
        // 国内镜像（缓解国外源过慢）
        url 'https://maven.aliyun.com/repository/public'
    }
    mavenCentral()
    maven {
        // Minecraft 运行库（text2speech 等 Mojang 专属）
        url 'https://libraries.minecraft.net/'
    }
    maven {
        url 'https://maven.fabricmc.net/'
    }
    maven {
        // JEI
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.property('fabric_loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"

    // JEI：仅编译期 API + 开发运行期，不打包进产物
    modCompileOnly "curse.maven:jei-238222:${project.property('jei_cf_file')}"
    modRuntimeOnly "curse.maven:jei-238222:${project.property('jei_cf_file')}"

    // TwilightForest compat：1.21.1 Fabric 版只有 Beta，仅供编译；运行期不装
    modCompileOnly "curse.maven:the-twilight-forest-227639:${project.property('twilight_forest_cf_file')}"
    modCompileOnly "curse.maven:cyclops-core-232758:${project.property('cyclopscore_cf_file')}"

    compileOnly 'org.jetbrains:annotations:24.0.1'
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

loom {
    accessWidenerPath = file("src/main/resources/qikalib.accesswidener")
    mixin {
        // Loom 1.17 默认不再启用 mixin AP；这里显式开启，以便生成 refmap。
        useLegacyMixinAp = true
        // 固定 refmap 名，不随 archivesName 变化；需与 qikalib.mixins.json 的 "refmap" 一致，
        // 否则发布环境（intermediary）按此名找不到映射文件而崩溃。
        defaultRefmapName = "qikalib.refmap.json"
    }

    runs {
        configureEach {
            runDir = 'run'
        }
        client {
            client()
        }
        server {
            server()
        }
    }
}

processResources {
    var replaceProperties = [
            version                     : project.version,
            mod_id                      : mod_id,
            minecraft_version_range     : minecraft_version_range,
            fabric_loader_version_range : fabric_loader_version_range,
            fabric_api_version_range    : fabric_api_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

afterEvaluate {
    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                artifactId = "${mod_id}-${minecraft_version}-fabric"
                // Loom 的产物必须用 remapJar，dev jar 不能直接发布
                artifact tasks.named('remapJar')
                def remapSources = tasks.findByName('remapSourcesJar')
                if (remapSources != null) {
                    artifact remapSources
                }
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = 'https://maven.pkg.github.com/Qikahome/QikaLib'
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}
